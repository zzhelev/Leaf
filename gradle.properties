kotlin.code.style=official
isLinuxAarch64=false
useCross=false
isRustRelease=true
kotlin.daemon.jvmargs=-Xmx4g
# Fork-only: KSP runs inside the Gradle daemon and leaves classes behind on each build, so Gradle's default 384 MB of
# Metaspace ran out after a few builds (OutOfMemoryError: Metaspace in :domain:kspKotlin).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g

# Leaf has no Apple Developer ID yet, so macOS builds are signed ad hoc by default. To sign with a Developer ID, set
# SIGNING_IDENTITY and pass -Pcompose.desktop.mac.sign=true.
compose.desktop.mac.sign=false
