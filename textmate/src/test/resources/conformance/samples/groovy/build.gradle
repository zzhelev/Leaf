plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.example'
version = "1.2.${System.getenv('BUILD_NUMBER') ?: '0'}"

def jgitVersion = '7.7.0'

dependencies {
    implementation "org.eclipse.jgit:org.eclipse.jgit:$jgitVersion"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
}

/* Prints the branches the build knows. */
tasks.register('branches') {
    doLast {
        def names = ['main', 'develop'].collect { it.toUpperCase() }
        println "Branches: ${names.join(', ')} (${names.size()})"
        assert names.every { it ==~ /[A-Z]+/ }
    }
}
