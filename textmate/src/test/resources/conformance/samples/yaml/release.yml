# Builds a release when a tag is pushed.
name: Release
on:
  push:
    tags: ["leaf-*"]

env:
  JAVA_VERSION: 25
  DRY_RUN: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build
        run: |
          ./gradlew build --no-daemon
          echo "done" # in the shell
      - name: Anchors
        env: &shared
          retries: 3
        with: *shared
