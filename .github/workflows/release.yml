name: Release Build

# Builds Leaf for macOS (Apple Silicon), Windows (x64) and Linux (x86_64 and aarch64 jars, amd64 and arm64 .deb
# packages).
# - Pushing a tag named leaf-X.Y.Z builds everything and creates a draft GitHub release with the files attached.
#   The tag must match projectVersion in app/build.gradle.kts. Review the draft, write the notes, then publish it.
# - Running the workflow by hand (Actions tab, "Run workflow") only builds. The files are kept as workflow artifacts
#   for a week.
# The macOS build is signed ad hoc. Signing with a Developer ID and notarizing need Apple credentials as secrets.
# Each build job attests its files: GitHub's signed record of the workflow and commit that built them.
# On a tag, the draft release is made, and the sign job writes the update manifest (leaf-update.json, each file's size
# and SHA-256) and signs it with the key that Leaf trusts as "github", which Leaf checks before it updates itself
# (docs/fork/auto-update.md). The key is the LEAF_RELEASE_KEY secret of the release-signing environment, which only
# leaf-* tags may use and which waits for the maintainer's approval. The attach job then attaches both to the draft.
# Rejecting the sign job instead leaves the release to be signed on a computer (release-manifest/sign-release.sh).

on:
  push:
    tags:
      - 'leaf-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Work out the version
        run: |
          declared=$(sed -n 's/^val projectVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/leaf-* ]]; then
            version="${GITHUB_REF_NAME#leaf-}"
            if [[ "$version" != "$declared" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match projectVersion $declared in app/build.gradle.kts"
              exit 1
            fi
          else
            version="$declared-dev.${GITHUB_SHA::8}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  build_macos:
    needs: version
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Check the fonts are real files, not Git LFS pointers
        run: |
          if find app/src/main/composeResources/font -name '*.ttf' -size -2k | grep -q .; then
            echo "::error::The fonts are Git LFS pointers"
            exit 1
          fi
      # Pinned to a commit: a tag or branch can be moved to other code. This is the stable branch's commit.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Set up the JetBrains JDK 25, which includes jlink, jpackage and the jmods
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'jetbrains'
      - name: Build the DMG
        run: ./gradlew :app:packageDmg -Pcompose.desktop.mac.sign=false
      - name: Check leaf-askpass was built
        run: test -f app/src/main/resources/leaf-askpass
      - name: Collect the files
        run: |
          mkdir Output
          mv app/build/compose/binaries/main/dmg/Leaf-*.dmg "Output/Leaf-$VERSION-macos-arm64.dmg"
      - name: Attest the files
        uses: actions/attest@v4
        with:
          subject-path: 'Output/*'
      - name: Add checksums
        run: cd Output && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: leaf-macos-arm64
          path: Output/*
          retention-days: 7

  build_windows:
    needs: version
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Check the fonts are real files, not Git LFS pointers
        shell: bash
        run: |
          if find app/src/main/composeResources/font -name '*.ttf' -size -2k | grep -q .; then
            echo "::error::The fonts are Git LFS pointers"
            exit 1
          fi
      # Pinned to a commit: a tag or branch can be moved to other code. This is the stable branch's commit.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Set up the JetBrains JDK 25, which includes jlink, jpackage and the jmods
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'jetbrains'
          architecture: x64
      - name: Build the app
        shell: cmd
        run: gradlew.bat createDistributable
      - name: Check leaf-askpass was built
        shell: bash
        run: test -f app/src/main/resources/leaf-askpass.exe
      - name: Build the installer
        # Calls Inno Setup's compiler directly: the Inno-Setup-Action didn't pass /DMyAppVersion through to it.
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Inno Setup 6\iscc.exe" choco install innosetup -y --no-progress
          "%ProgramFiles(x86)%\Inno Setup 6\iscc.exe" /O+ "/DMyAppVersion=%VERSION%" leaf.iss
      - name: Build the portable ZIP
        shell: pwsh
        run: Compress-Archive -Path app/build/compose/binaries/main/app/Leaf/* -DestinationPath "Output/Leaf-$env:VERSION-windows-x64-portable.zip"
      - name: Attest the files
        uses: actions/attest@v4
        with:
          subject-path: 'Output/*'
      - name: Add checksums
        shell: bash
        run: cd Output && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: leaf-windows-x64
          path: Output/*
          retention-days: 7

  build_linux:
    needs: version
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: x86_64
            aarch64: 'false'
            target: x86_64-unknown-linux-gnu
          - suffix: arm_aarch64
            aarch64: 'true'
            target: aarch64-unknown-linux-gnu
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Check the fonts are real files, not Git LFS pointers
        run: |
          if find app/src/main/composeResources/font -name '*.ttf' -size -2k | grep -q .; then
            echo "::error::The fonts are Git LFS pointers"
            exit 1
          fi
      # Pinned to a commit: a tag or branch can be moved to other code. This is the stable branch's commit.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install cross and the Rust target
        run: |
          cargo install cross --locked
          cd rs && rustup target add ${{ matrix.target }}
      - name: Set up the JetBrains JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'jetbrains'
          architecture: x64
      - name: Build the jar
        run: ./gradlew fatJarLinux -PisLinuxAarch64=${{ matrix.aarch64 }} -PuseCross=true
      - name: Check leaf-askpass was built
        run: test -f app/src/main/resources/leaf-askpass
      - name: Collect the files
        run: |
          mkdir Output
          mv app/build/libs/Leaf-linux-${{ matrix.suffix }}-*.jar "Output/Leaf-$VERSION-linux-${{ matrix.suffix }}.jar"
      - name: Attest the files
        uses: actions/attest@v4
        with:
          subject-path: 'Output/*'
      - name: Add checksums
        run: cd Output && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: leaf-linux-${{ matrix.suffix }}
          path: Output/*
          retention-days: 7

  build_linux_deb:
    needs: version
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Built natively on Ubuntu 22.04, because jpackage can't build a package for another CPU, and because the package
    # works on systems as old as the one it was built on:
    # - The package's dependencies are the build system's package names. Ubuntu 24.04's renamed libraries (such as
    #   libasound2t64) don't exist on Debian 12 or Ubuntu 22.04, while 24.04 still accepts 22.04's names.
    # - leaf-askpass, the one Rust program, needs the build system's glibc or newer (2.35 on 22.04).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Check the fonts are real files, not Git LFS pointers
        run: |
          if find app/src/main/composeResources/font -name '*.ttf' -size -2k | grep -q .; then
            echo "::error::The fonts are Git LFS pointers"
            exit 1
          fi
      # Pinned to a commit: a tag or branch can be moved to other code. This is the stable branch's commit.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # jpackage lists only the libraries it finds installed as dependencies. skiko's arm64 library needs libEGL.so.1,
      # and the arm64 runner has no libegl1, so without it the package would lack that dependency.
      - name: Install fakeroot, which jpackage needs to build a .deb, and libegl1
        run: sudo apt-get update && sudo apt-get install -y fakeroot libegl1
      - name: Set up the JetBrains JDK 25, which includes jlink, jpackage and the jmods
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'jetbrains'
      - name: Build the package
        run: ./gradlew :app:packageDeb
      - name: Check leaf-askpass was built
        run: test -f app/src/main/resources/leaf-askpass
      - name: Check the arm64 package depends on libegl1
        if: matrix.arch == 'arm64'
        run: |
          if ! dpkg-deb --field app/build/compose/binaries/main/deb/leaf_*_arm64.deb Depends | grep -qw libegl1; then
            echo "::error::The package doesn't depend on libegl1, which skiko's arm64 library needs"
            exit 1
          fi
      - name: Collect the files
        run: |
          mkdir Output
          mv app/build/compose/binaries/main/deb/leaf_*_${{ matrix.arch }}.deb "Output/Leaf-$VERSION-linux-${{ matrix.arch }}.deb"
      - name: Attest the files
        uses: actions/attest@v4
        with:
          subject-path: 'Output/*'
      - name: Add checksums
        run: cd Output && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: leaf-linux-deb-${{ matrix.arch }}
          path: Output/*
          retention-days: 7

  # The only job with the signing key, so it runs nothing that could read it: GitHub's own actions, pinned to commits,
  # and release-manifest/sign-manifest.sh, which uses the shell's tools and ssh-keygen. No build tools, no third-party
  # actions, and no token that can write: the attach job attaches what it signed.
  sign:
    if: startsWith(github.ref, 'refs/tags/leaf-')
    needs: [version, build_macos, build_windows, build_linux, build_linux_deb]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            release-manifest/sign-manifest.sh
            release-manifest/src/main/resources/dev/app/leaf/releasemanifest/trusted-release-keys
            app/src/main/kotlin/dev/app/leaf/AppConstants.kt
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: files
          merge-multiple: true
      - id: code
        name: Read the version code
        run: |
          constants=app/src/main/kotlin/dev/app/leaf/AppConstants.kt
          app_version=$(sed -n 's/^ *const val APP_VERSION = "\(.*\)"$/\1/p' "$constants")
          code=$(sed -n 's/^ *const val APP_VERSION_CODE = \([0-9][0-9]*\)$/\1/p' "$constants")
          if [[ "$app_version" != "$VERSION" ]]; then
            echo "::error::APP_VERSION in AppConstants.kt is $app_version, not $VERSION"
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Write and sign the update manifest
        env:
          LEAF_RELEASE_KEY: ${{ secrets.LEAF_RELEASE_KEY }}
          CODE: ${{ steps.code.outputs.code }}
        run: |
          if [[ -z "$LEAF_RELEASE_KEY" ]]; then
            echo "::error::No LEAF_RELEASE_KEY secret in the release-signing environment (docs/fork/auto-update.md, section 11)"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/leaf-release-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$LEAF_RELEASE_KEY" > "$key"
          release-manifest/sign-manifest.sh "$VERSION" "$CODE" files "$key" github signed
      # Not named leaf-*, so that the release job, which takes those, doesn't attach it before the attach job checks it
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: update-manifest
          path: signed/*
          retention-days: 7

  # Doesn't wait for the sign job: the draft is made whether the release is signed here or on a computer
  release:
    if: startsWith(github.ref, 'refs/tags/leaf-')
    needs: [version, build_macos, build_windows, build_linux, build_linux_deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: Output
          pattern: leaf-*
          merge-multiple: true
      - name: Create a draft release
        # Pinned to a commit, as this step gets the token that writes the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          name: Leaf ${{ needs.version.outputs.version }}
          body: |
            Draft created by the release workflow. Write the release notes, then publish it.
          files: Output/*

  # Attaches the signed manifest to the draft. When the draft has one already, signed on a computer, it must be the
  # same bytes, and only the signature is added.
  attach:
    if: startsWith(github.ref, 'refs/tags/leaf-')
    needs: [release, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: release-manifest/attach-manifest.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: update-manifest
          path: signed
      - name: Attach the manifest and its signature to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: release-manifest/attach-manifest.sh "$GITHUB_REF_NAME" signed
