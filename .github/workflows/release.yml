name: Release Build

# Builds Leaf for macOS (Apple Silicon), Windows (x64) and Linux (x86_64 and aarch64 jars, amd64 and arm64 .deb
# packages).
# - Pushing a tag named leaf-X.Y.Z builds everything and creates a draft GitHub release with the files attached.
#   The tag must match projectVersion in app/build.gradle.kts. Review the draft, write the notes, then publish it.
# - Running the workflow by hand (Actions tab, "Run workflow") only builds. The files are kept as workflow artifacts
#   for a week.
# The macOS build is signed ad hoc. Signing with a Developer ID and notarizing need Apple credentials as secrets.

on:
  push:
    tags:
      - 'leaf-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Work out the version
        run: |
          declared=$(sed -n 's/^val projectVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/leaf-* ]]; then
            version="${GITHUB_REF_NAME#leaf-}"
            if [[ "$version" != "$declared" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match projectVersion $declared in app/build.gradle.kts"
              exit 1
            fi
          else
            version="$declared-dev.${GITHUB_SHA::8}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  build_macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Check the fonts are real files, not Git LFS pointers
        run: |
          if find app/src/main/composeResources/font -name '*.ttf' -size -2k | grep -q .; then
            echo "::error::The fonts are Git LFS pointers"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up the JetBrains JDK 25, which includes jlink, jpackage and the jmods
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'jetbrains'
      - name: Build the DMG
        run: ./gradlew :app:packageDmg -Pcompose.desktop.mac.sign=false
      - name: Check the Rust library was built
        run: test -f app/src/main/resources/libleaf_rs.dylib
      - name: Collect the files
        run: |
          mkdir Output
          mv app/build/compose/binaries/main/dmg/Leaf-*.dmg "Output/Leaf-$VERSION-macos-arm64.dmg"
          cd Output && for f in *; do shasum -a 256 "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: leaf-macos-arm64
          path: Output/*
          retention-days: 7

  build_windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Check the fonts are real files, not Git LFS pointers
        shell: bash
        run: |
          if find app/src/main/composeResources/font -name '*.ttf' -size -2k | grep -q .; then
            echo "::error::The fonts are Git LFS pointers"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up the JetBrains JDK 25, which includes jlink, jpackage and the jmods
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'jetbrains'
          architecture: x64
      - name: Build the app
        shell: cmd
        run: gradlew.bat createDistributable
      - name: Check the Rust library was built
        shell: bash
        run: test -f app/src/main/resources/leaf_rs.dll
      - name: Build the installer
        # Calls Inno Setup's compiler directly: the Inno-Setup-Action didn't pass /DMyAppVersion through to it.
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Inno Setup 6\iscc.exe" choco install innosetup -y --no-progress
          "%ProgramFiles(x86)%\Inno Setup 6\iscc.exe" /O+ "/DMyAppVersion=%VERSION%" leaf.iss
      - name: Build the portable ZIP
        shell: pwsh
        run: Compress-Archive -Path app/build/compose/binaries/main/app/Leaf/* -DestinationPath "Output/Leaf-$env:VERSION-windows-x64-portable.zip"
      - name: Add checksums
        shell: bash
        run: cd Output && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: leaf-windows-x64
          path: Output/*
          retention-days: 7

  build_linux:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: x86_64
            aarch64: 'false'
            target: x86_64-unknown-linux-gnu
          - suffix: arm_aarch64
            aarch64: 'true'
            target: aarch64-unknown-linux-gnu
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Check the fonts are real files, not Git LFS pointers
        run: |
          if find app/src/main/composeResources/font -name '*.ttf' -size -2k | grep -q .; then
            echo "::error::The fonts are Git LFS pointers"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross and the Rust target
        run: |
          cargo install cross --locked
          cd rs && rustup target add ${{ matrix.target }}
      - name: Set up the JetBrains JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'jetbrains'
          architecture: x64
      - name: Build the jar
        run: ./gradlew fatJarLinux -PisLinuxAarch64=${{ matrix.aarch64 }} -PuseCross=true
      - name: Check the Rust library was built
        run: test -f app/src/main/resources/libleaf_rs.so
      - name: Collect the files
        run: |
          mkdir Output
          mv app/build/libs/Leaf-linux-${{ matrix.suffix }}-*.jar "Output/Leaf-$VERSION-linux-${{ matrix.suffix }}.jar"
          cd Output && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: leaf-linux-${{ matrix.suffix }}
          path: Output/*
          retention-days: 7

  build_linux_deb:
    needs: version
    # Built natively on Ubuntu 22.04, because jpackage can't build a package for another CPU, and because the package
    # works on systems as old as the one it was built on:
    # - The package's dependencies are the build system's package names. Ubuntu 24.04's renamed libraries (such as
    #   libasound2t64) don't exist on Debian 12 or Ubuntu 22.04, while 24.04 still accepts 22.04's names.
    # - The Rust library needs the build system's glibc or newer (2.35 on 22.04).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Check the fonts are real files, not Git LFS pointers
        run: |
          if find app/src/main/composeResources/font -name '*.ttf' -size -2k | grep -q .; then
            echo "::error::The fonts are Git LFS pointers"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      # jpackage lists only the libraries it finds installed as dependencies. skiko's arm64 library needs libEGL.so.1,
      # and the arm64 runner has no libegl1, so without it the package would lack that dependency.
      - name: Install fakeroot, which jpackage needs to build a .deb, and libegl1
        run: sudo apt-get update && sudo apt-get install -y fakeroot libegl1
      - name: Set up the JetBrains JDK 25, which includes jlink, jpackage and the jmods
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'jetbrains'
      - name: Build the package
        run: ./gradlew :app:packageDeb
      - name: Check the Rust library was built
        run: test -f app/src/main/resources/libleaf_rs.so
      - name: Check the arm64 package depends on libegl1
        if: matrix.arch == 'arm64'
        run: |
          if ! dpkg-deb --field app/build/compose/binaries/main/deb/leaf_*_arm64.deb Depends | grep -qw libegl1; then
            echo "::error::The package doesn't depend on libegl1, which skiko's arm64 library needs"
            exit 1
          fi
      - name: Collect the files
        run: |
          mkdir Output
          mv app/build/compose/binaries/main/deb/leaf_*_${{ matrix.arch }}.deb "Output/Leaf-$VERSION-linux-${{ matrix.arch }}.deb"
          cd Output && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v7
        with:
          name: leaf-linux-deb-${{ matrix.arch }}
          path: Output/*
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/leaf-')
    needs: [version, build_macos, build_windows, build_linux, build_linux_deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: Output
          merge-multiple: true
      - name: Create a draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Leaf ${{ needs.version.outputs.version }}
          body: |
            Draft created by the release workflow. Write the release notes, then publish it.
          files: Output/*
